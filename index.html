  <div class="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
    <button class="lightbox-prev" type="button" aria-label="Previous image">&#10094;</button>
    <img class="lightbox-image" alt="">
    <button class="lightbox-next" type="button" aria-label="Next image">&#10095;</button>
  </div>

  <script>
    const lightbox = document.querySelector('.lightbox');
    const lightboxImage = document.querySelector('.lightbox-image');
    const closeButton = document.querySelector('.lightbox-close');
    const previousButton = document.querySelector('.lightbox-prev');
    const nextButton = document.querySelector('.lightbox-next');
    let lightboxImages = [];
    let lightboxIndex = 0;

    function getVisibleGalleryImages() {
      return [...document.querySelectorAll('.gallery-section img')]
        .filter(image => image.getClientRects().length > 0);
    }

    function updateLightboxImage() {
      const image = lightboxImages[lightboxIndex];
      if (!image) return;

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      previousButton.disabled = lightboxIndex === 0;
      nextButton.disabled = lightboxIndex === lightboxImages.length - 1;
    }

    function openLightbox(image) {
      lightboxImages = getVisibleGalleryImages();
      lightboxIndex = lightboxImages.indexOf(image);
      updateLightboxImage();
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lightbox-open');
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lightbox-open');
    }

    function showPreviousImage() {
      if (lightboxIndex > 0) {
        lightboxIndex -= 1;
        updateLightboxImage();
      }
    }

    function showNextImage() {
      if (lightboxIndex < lightboxImages.length - 1) {
        lightboxIndex += 1;
        updateLightboxImage();
      }
    }

    document.addEventListener('click', event => {
      const image = event.target.closest('.gallery-section img');
      if (image) openLightbox(image);
    });

    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('is-open')) return;
      if (event.key === 'ArrowLeft') showPreviousImage();
      if (event.key === 'ArrowRight') showNextImage();
      if (event.key === 'Escape') closeLightbox();
    });

    closeButton.addEventListener('click', closeLightbox);
    previousButton.addEventListener('click', showPreviousImage);
    nextButton.addEventListener('click', showNextImage);

    function showSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.add('is-open');
    }

    function hideSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.remove('is-open');
    }

    function showSection(sectionId) {
      const sections = document.querySelectorAll('.gallery-section');

      sections.forEach(section => {
        section.style.display = 'none';
      });

      const activeSection = document.getElementById(sectionId);
      if (activeSection) {
        activeSection.style.display = 'flex';
      }
      
      // Optional: Close sidebar on mobile when a link is clicked
      hideSidebar();
    }
  </script>
